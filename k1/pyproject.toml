[project]
name = "k1-pipeline"
version = "0.1.0"
description = "K1 Knowledge Graph construction pipeline for the Proactive Cooking Assistance thesis"
requires-python = ">=3.11"
dependencies = [
    # HTTP + parsing
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    # Pydantic + LLM constrained decoding
    "pydantic>=2.7",
    "instructor>=1.3",
    "openai>=1.30",
    "litellm>=1.40",
    # Google Gemini
    "google-generativeai>=0.7",
    # Graph + validation
    "networkx>=3.3",
    # Neo4j (optional, for live ingestion)
    "neo4j>=5.19",
    # Visualization
    "streamlit>=1.35",
    "pyvis>=0.3",
    # Config
    "pyyaml>=6.0",
    # Utilities
    "python-dotenv>=1.0",
    "rich>=13.0",
    "click>=8.1",
]

[project.scripts]
k1 = "k1_pipeline.cli:cli"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/k1_pipeline"]


[tool.ruff]
line-length = 100

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
