# K1 Ontology — frozen in k1-0.1.0
# Do not modify without updating CHANGELOG.md.
# Source: Kumbhakern et al. [14] + PIC §4.6.

node_types:
  - name: Process
    description: >
      A cooking action that changes ingredient state.
      Must have HAS_SAFETY_BOUND if it involves heat.
    required_fields: [pre_conditions, post_conditions]
    thermal_requires_safety_bound: true

  - name: Transfer
    description: >
      Movement of an ingredient or item (e.g. pour into pan, remove from heat).
    required_fields: [pre_conditions, post_conditions]
    thermal_requires_safety_bound: false

  - name: Plate
    description: >
      Plating or serving step. Final node in any recipe branch.
    required_fields: [pre_conditions]
    thermal_requires_safety_bound: false

edge_types:
  - name: NEXT
    description: Sequential ordering within a recipe branch
  - name: REQUIRES
    description: Pre-condition dependency across nodes
  - name: HAS_SAFETY_BOUND
    description: Typed physics constraint edge on a Process node
  - name: INGREDIENT_OF
    description: Links Ingredient node → Process node
  - name: USES_TOOL
    description: Links Tool node → Process node

# ── K2 compile map (frozen) ───────────────────────────────────────────────────
# The LLM extracts fine-grained physics_state strings.
# These are compiled to k2_label BEFORE storage.
# k2_label must be one of the four values below.

k2_compile_map:
  liquid:
    - raw
    - heterogeneous_liquid
    - homogenized
    - aerated_liquid
    - whisked
    - unwhisked
    - unbeaten
    - beaten
    - mixed
    - runny
    - fluid

  coagulating:
    - coagulating
    - gel
    - soft_curd
    - semi_solid
    - partial_set
    - warming
    - loose_curd
    - creamy
    - custard_like
    - thickening

  solid:
    - solid
    - solid_curd
    - fully_set
    - firm
    - cross_linked
    - set
    - cooked_through
    - toasted
    - baked
    - baked_bread

  scorched:
    - scorched
    - burnt
    - over_contracted
    - browning
    - maillard_advanced
    - syneresis_weeping
    - rubbery
    - dry
    - overcooked

# ── Canonical entities (for entity resolution) ───────────────────────────────

canonical_entities:
  # k1-0.3.0: Portuguese names, parts of the egg, and the remaining station
  # inventory (pepper, oregano, heat_source) added. See config/dish.yaml.
  # Oregano left the inventory on 2026-10-23; its aliases stay so a mention
  # resolves to `oregano` and the scope rule removes it.
  - canonical: egg
    aliases: [eggs, whole egg, whole eggs, large egg, large eggs, egg mixture, egg mix,
              beaten egg, beaten eggs, scrambled egg, scrambled eggs,
              egg white, egg whites, egg yolk, egg yolks, yolk, yolks,
              ovo, ovos, ovos batidos, ovos mexidos, gema, gemas, clara, claras]
  - canonical: butter
    aliases: [unsalted butter, salted butter, cold butter, knob of butter, manteiga]
  - canonical: oil
    aliases: [olive oil, extra virgin olive oil, cooking oil, vegetable oil, neutral oil, azeite, óleo]
  - canonical: salt
    aliases: [fine salt, sea salt, kosher salt, table salt, sal]
  - canonical: pepper
    aliases: [black pepper, white pepper, ground pepper, ground black pepper,
              freshly ground black pepper, pimenta, pimenta preta]
  - canonical: oregano
    aliases: [dried oregano, orégano, orégão, orégãos, oregãos]
  - canonical: pan
    aliases: [non-stick pan, nonstick pan, frying pan, skillet, saucepan, medium saucepan,
              non-stick skillet, nonstick skillet, saute pan, omelette pan, cast iron pan,
              frigideira]
  - canonical: spatula
    aliases: [rubber spatula, silicone spatula, heatproof spatula, wooden spatula,
              wooden spoon, spoon, espátula, colher de pau]
  - canonical: bowl
    aliases: [mixing bowl, small bowl, medium bowl, jug, measuring jug, tigela, taça]
  - canonical: whisk
    aliases: [fork, balloon whisk, hand whisk, garfo, batedor, vara de arames]
  - canonical: plate
    aliases: [serving plate, dish, prato]
  - canonical: heat_source
    aliases: [heat source, heat, stove, stovetop, hob, induction hob, burner, cooktop,
              fogo, lume, fogão]
  # Preparations are the same object as the base food. Names not listed here
  # stay as new entities (goat cheese, cream, herbs, and so on).
  - canonical: bread
    aliases: [toast, buttered toast, lightly buttered toast, toasted bread, pumpernickel, pumpernickel bread]
