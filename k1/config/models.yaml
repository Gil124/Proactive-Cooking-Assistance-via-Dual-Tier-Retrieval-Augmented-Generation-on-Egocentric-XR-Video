# Model pins — frozen in k1-0.1.0
# Record any change in CHANGELOG.md before modifying.

extraction:
  generator: "groq/llama-3.3-70b-versatile"
  temperature: 0
  max_tokens: 2048

critic:
  # Must be a different model family from the generator
  model: "openrouter/google/gemini-2.0-flash-lite"
  temperature: 0
  max_tokens: 512

embedding:
  # Local, no API required
  model: "sentence-transformers/all-MiniLM-L6-v2"

fallback_generators:
  - "openrouter/qwen/qwen-2.5-72b-instruct:free"
  - "openrouter/meta-llama/llama-3.3-70b-instruct:free"
  - "gemini/gemini-2.0-flash-lite"

fallback_critics:
  - "openrouter/qwen/qwen-2.5-72b-instruct:free"
  - "groq/llama-3.3-70b-versatile"
