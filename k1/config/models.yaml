# Model pins — updated in k1-0.2.1 for current provider availability.
# Record any change in CHANGELOG.md before modifying.
#
# Note: Groq retired llama-3.3-70b-versatile as of 2026-09.
# Gemini routes through the OpenAI-compatible endpoint (google.generativeai SDK removed).

extraction:
  # Generator must be a different model family from the critic (bias control).
  # Qwen family (via Groq) for generator; Gemini family for critic.
  generator: "groq/qwen/qwen3.8-27b"
  temperature: 0
  max_tokens: 2048

critic:
  # Must be a different model family from the generator
  model: "gemini/gemini-3.5-flash"
  temperature: 0
  max_tokens: 512

# embedding block removed in k1-0.2.0 (entity resolution is dictionary-only for v1)

fallback_generators:
  - "groq/qwen/qwen3.6-27b"
  - "gemini/gemini-3.5-flash-lite"
  - "openrouter/google/gemini-2.5-flash"

fallback_critics:
  - "gemini/gemini-3.5-flash-lite"
  - "openrouter/google/gemini-2.5-flash"
  - "groq/qwen/qwen3.8-27b"
