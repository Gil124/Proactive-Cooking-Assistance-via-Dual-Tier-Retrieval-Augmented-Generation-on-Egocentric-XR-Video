# Model pins — k1-0.2.3. Chat calls go through OpenRouter only.
# Record any change in CHANGELOG.md before modifying.
#
# Generator and prose critic stay in different families (bias control).
# Jev is the semantic gate and does not write revision text.

extraction:
  # Qwen family. JSON mode (tool calling is unreliable on this family).
  generator: "openrouter/qwen/qwen3.5-397b-a17b"
  temperature: 0
  # Reasoning tokens count against this cap. 2048 truncated the JSON.
  max_tokens: 16384

critic:
  # Generative critic. Called only when Jev does not accept the extraction,
  # because the revision loop needs written revision_instructions.
  # Gemini family, so it does not grade Qwen's own output.
  model: "openrouter/google/gemini-3.7-flash"
  temperature: 0
  # Same reason as the generator: thinking tokens share this budget.
  max_tokens: 8192

# Semantic gate in front of the generative critic.
# TypeSafe Jev via the OpenRouter Decisions API. Not a text generator.
# Accepts without calling the critic model only when every Noul and the
# Choice probability of "accept" are at least noul_accept_threshold.
jev:
  model: "typesafe/jev-1.13"
  noul_accept_threshold: 0.85

# embedding block removed in k1-0.2.0 (entity resolution is dictionary-only for v1)

# Fallbacks stay on OpenRouter and in the same family as the primary.
fallback_generators:
  - "openrouter/qwen/qwen3.6-flash"
  - "openrouter/qwen/qwen3.5-flash-02-23"

fallback_critics:
  - "openrouter/google/gemini-3.5-flash"
