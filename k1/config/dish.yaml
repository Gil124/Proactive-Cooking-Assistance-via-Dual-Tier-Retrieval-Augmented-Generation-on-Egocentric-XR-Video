#
# Names below are canonical entity names. Aliases (other wording, Portuguese,
# interchangeable utensils) live in ontology.yaml `canonical_entities`.
# Safety bounds B are in physics_bounds.yaml.

dish: scrambled_eggs

# Bump this whenever the inventory, the goal, or the definition changes.
# A gold file saved under another value is treated as out of date and is
# left out of every metric until it is reviewed again.
definition_version: "2026-10-11"
servings: 1

start_state: >
  Standardised laboratory station: eggs in shell, all inventory items at hand,
  pan cold, heat source off.

goal:
  entity: egg
  k2_labels: [coagulating, solid]
  location: plate

inventory:
  ingredients:
    - egg
    - salt
    - pepper
    - butter
    - oil
    # oregano removed 2026-10-23: no source recipe uses it (Notes/10-recipe-variation.md B.7).
    # definition_version not bumped: no reviewed step names oregano, so no review changes.
  utensils:
    - pan
    - bowl
    - spatula      # wooden spatula or wooden spoon
    - whisk        # hand whisk or fork
    - plate
    - heat_source

