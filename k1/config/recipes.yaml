# K1 Recipe Allowlist — scrambled eggs only
# Original 10 frozen in k1-0.1.0. Eight more added in k1-0.2.6.
# Do not add non-scrambled-egg dishes.
#
# Fields:
#   recipe_id     : unique slug used as artifact directory name
#   url           : source URL
#   variant_label : short descriptor for branch labelling in the DAG
#   gold          : true = held-out gold recipe (do NOT use as prompt example)
#   excluded      : reason this recipe is left out: it is not a variation of the dish
#                   (config/dish.yaml, Notes/10-recipe-variation.md), or it did not ingest
#                   as usable steps. Excluded recipes are skipped by every stage.
#   notes         : optional

recipes:

